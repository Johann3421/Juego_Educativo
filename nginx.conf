server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # MIME types handling
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
        application/octet-stream bin;
        application/wasm wasm;
    }

    # Security & isolation headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Handle static game assets and large files (like package.bin)
    location ~* \.(?:bin|wasm|data)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache static images and icons
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Cache JS / CSS
    location ~* \.(?:css|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Main SPA / index fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck endpoint for Dokploy / VPS monitoring
    location /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
